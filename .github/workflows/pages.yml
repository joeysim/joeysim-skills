# Publish pages/ to GitHub Pages, with each skill's downloads built from skills/.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the site
        run: |
          mkdir _site
          cp -R pages/. _site/
          for dir in pages/*/; do
            name=$(basename "$dir")
            cp -R "skills/$name" "_site/$name/skill"
            python3 -m zipfile -c "_site/$name/$name.zip" "skills/$name"
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deploy
        uses: actions/deploy-pages@v5
